version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Типы должны соответствовать Node из .nvmrc (22), а не самому свежему.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
