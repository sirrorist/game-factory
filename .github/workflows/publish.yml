name: Publish

# Образы для прода - только после зелёного CI на main (D-034). CI не гоняется на правки
# одной документации (D-031), значит и публикации на них нет. Вручную - Run workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  mail-gate:
    name: допуск образа почты
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Успешный CI и smoke для точного SHA
        id: gate
        run: node .github/scripts/mail-publish-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIL_CHECKOUT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

  mail-image:
    name: образ почты в GHCR
    needs: mail-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.mail-gate.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: apps/mail-relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sirrorist/game-factory-mail-relay:${{ needs.mail-gate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/sirrorist/game-factory
            org.opencontainers.image.revision=${{ needs.mail-gate.outputs.sha }}
          cache-from: type=gha,scope=mail-relay
          cache-to: type=gha,mode=max,scope=mail-relay
      - name: Артефакт для отдельно согласуемого размещения
        env:
          IMAGE_SHA: ${{ needs.mail-gate.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ $IMAGE_SHA =~ ^[0-9a-f]{40}$ && $IMAGE_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'mail-relay\nSHA: %s\nPlatform: linux/amd64\nImage: ghcr.io/sirrorist/game-factory-mail-relay@%s\n' "$IMAGE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Base: %s\n' "$(sed -n 's/^FROM //p' apps/mail-relay/Dockerfile)" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: образы в GHCR
    # workflow_run приходит и на красный CI, и на CI из PR-веток форков - отсекаем.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        target: [hub, play, games, migrate]
    steps:
      # Ровно тот коммит, что прошёл CI, а не текущая голова main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          # VPS-1 - x86_64 (разведка 2026-09-25).
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sirrorist/game-factory-${{ matrix.target }}:${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/sirrorist/game-factory-${{ matrix.target }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/sirrorist/game-factory
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
