name: Docker

# Образы собираются, только когда меняется то, из чего они собираются: полная сборка
# хаба в Docker - лишние минуты на каждый пуш (D-031). Вручную - кнопкой Run workflow.
on:
  push:
    branches: [main, dev]
    paths: ["Dockerfile", "docker-compose.yml", ".dockerignore", "pnpm-lock.yaml", "deploy/**", "packages/db/**", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["Dockerfile", "docker-compose.yml", ".dockerignore", "pnpm-lock.yaml", "deploy/**", "packages/db/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: образы docker-compose и games
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: docker compose build

      # Пароль базы для CI - случайный, в файле, как на проде (секрет compose).
      - name: compose.prod.yml разбирается
        run: |
          mkdir -p deploy/secrets
          head -c 24 /dev/urandom | base64 > deploy/secrets/db_password
          chmod 0644 deploy/secrets/db_password
          GF_IMAGE_TAG=ci docker compose -f deploy/compose.prod.yml --profile publish config --quiet

      # Публикатор прода: второй прогон в тот же том - "без изменений", а не отказ (D-034).
      - name: образ games публикует и не ломает неизменяемость
        run: |
          docker build --target games -t gf-games .
          docker volume create gf-data-ci
          docker run --rm --read-only -v gf-data-ci:/data gf-games
          docker run --rm --read-only -v gf-data-ci:/data gf-games | tee second.log
          grep -q 'без изменений' second.log
          ! grep -q 'опубликована' second.log

      # База и миграции - ровно по deploy/compose.prod.yml: пользователь 70, read_only,
      # cap_drop ALL, пароль файлом. Миграции дважды - второй раз ничего не меняет.
      - name: база из compose.prod.yml поднимается, миграции проходят
        run: |
          docker network create --internal gf-edge
          docker network create --internal gf-db
          docker build --target migrate -t ghcr.io/sirrorist/game-factory-migrate:ci .
          export GF_IMAGE_TAG=ci
          c="docker compose -f deploy/compose.prod.yml --profile publish"
          $c up -d --wait db
          $c run --rm migrate
          $c run --rm migrate
          $c exec -T db psql -U gf -d gf -Atc "select string_agg(tablename, ',' order by tablename) from pg_tables where schemaname = 'public'" | tee tables.txt
          grep -qx 'game_saves,scores' tables.txt

          # Изоляция (D-038, D-051): play не в gf-db - базу не видит ни по имени, ни по адресу.
          # migrate в gf-db - видит: без этой контрольной пары "закрыто" могло бы значить
          # "зонд сломан". Мутация "play в gf-db" обязана здесь краснеть.
          probe='const [h, p, want] = process.argv.slice(1); const s = require("node:net").connect({ host: h, port: +p, timeout: 3000 });
            const done = (open) => { console.log(h, p, open ? "open" : "closed"); process.exit(open === (want === "open") ? 0 : 1); };
            s.on("connect", () => done(true)); s.on("error", () => done(false)); s.on("timeout", () => done(false));'
          docker build --target play -t ghcr.io/sirrorist/game-factory-play:ci .
          dbip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$($c ps -q db)")
          $c run --rm --no-deps --entrypoint node migrate -e "$probe" db 5432 open
          $c run --rm --no-deps --entrypoint node play -e "$probe" db 5432 closed
          $c run --rm --no-deps --entrypoint node play -e "$probe" "$dbip" 5432 closed
          $c down
