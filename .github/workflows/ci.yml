name: CI

# Правки только документации CI не гоняют - минуты не бесплатные (D-031).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  # Вручную: после force-push GitHub прогон не создал (П-038).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · unit · build · export · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Явно: lockfile обязателен, расхождение с package.json - красный CI.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm games:build

      - run: pnpm games:export

      - run: pnpm hub:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Chromium для e2e
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Офлайн-архивы игр
        uses: actions/upload-artifact@v7
        with:
          name: offline-games
          path: .data/storage/exports/*.zip
          if-no-files-found: error
          retention-days: 14

