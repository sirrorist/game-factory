name: CI

# Правки только документации CI не гоняют - минуты не бесплатные (D-031).
# dev - рабочая ветка, main - прод: CI на обеих, образы в прод - только с main (D-042).
on:
  push:
    branches: [main, dev]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  # Вручную: после force-push GitHub прогон не создал (П-038).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · unit · build · export · e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Postgres для e2e входа (слайс 1.2): тот же образ по digest, что db в deploy/compose.prod.yml.
    # Пароль - тестовый, база живёт только на время прогона.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: gf
          POSTGRES_DB: gf
          POSTGRES_PASSWORD: gf-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gf -d gf" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Явно: lockfile обязателен, расхождение с package.json - красный CI.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Миграции и ограничения схемы на PGlite (отдельно: ~1,3 ГБ памяти, П-043).
      - run: pnpm test:db

      - run: pnpm games:build

      # Та же version с другим содержимым прод не опубликует, и выкладка встанет молча
      # (П-034): например, Dependabot поднял движок. Здесь это красный CI с подсказкой.
      - name: Игры сверены с продом
        run: pnpm gf check-prod
        env:
          GF_PROD_GAME_URL: https://{id}.play.youranus.ru/

      - run: pnpm games:export

      - run: pnpm hub:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Chromium для e2e
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
        env:
          GF_E2E_PG: postgres://gf:gf-ci-only@127.0.0.1:5432/gf

      - name: Офлайн-архивы игр
        uses: actions/upload-artifact@v7
        with:
          name: offline-games
          path: .data/storage/exports/*.zip
          if-no-files-found: error
          retention-days: 14

