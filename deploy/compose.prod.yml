# Прод на VPS-1 за Traefik владельца (D-033, D-034). Руководство - docs/OPERATIONS.md.
#
# На сервере этот файл лежит копией root: /etc/docker/containers/game-factory/compose.yml,
# рядом .env с GF_IMAGE_TAG. Не из рабочей копии репозитория: root запускает compose,
# а файл, который правит обычный пользователь, дал бы ему root (D-035).
#
#   docker compose run --rm games     # публикация игр в том gf-data
#   docker compose up -d db && docker compose run --rm migrate
#   docker compose up -d hub play
#
# Домены вписаны прямо в метки: HostRegexp не собрать из переменной. Новый домен (D-010) -
# правка этого файла.

name: game-factory

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  # Одноразовый: сборка игр уже в образе (CI), здесь - публикация и архивы.
  games:
    <<: *hardening
    image: ghcr.io/sirrorist/game-factory-games:${GF_IMAGE_TAG:?GF_IMAGE_TAG в .env}
    profiles: [publish]
    network_mode: none
    mem_limit: 256m
    volumes:
      - gf-data:/data

  # База хаба (этап 1, D-047). Своя внутренняя сеть gf-db - только хаб и миграции, без
  # интернета; порт наружу не публикуется. Бэкап - дамп в бэкапе сервера (OPERATIONS.md):
  # он опирается на имя проекта game-factory, сервис db, роль и базу gf и мажор Postgres -
  # их смена ломает бэкап молча, сначала - запись в приватной базе инфраструктуры.
  db:
    <<: *hardening
    # По digest: таймер тянет образы под root каждые 5 минут, а тег меняется мимо CI и с
    # пересозданием контейнера с данными. Обновление - PR Dependabot (docker-compose) в dev.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    # Сразу пользователем postgres образа: без root при старте не нужны и CAP_CHOWN/SETUID.
    user: "70:70"
    mem_limit: 256m
    shm_size: 64m
    environment:
      POSTGRES_USER: gf
      POSTGRES_DB: gf
      POSTGRES_PASSWORD_FILE: /run/secrets/gf_db_password
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=20]
    secrets: [gf_db_password]
    volumes:
      - gf-db:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    networks: [gf-db]
    healthcheck:
      test: [CMD, pg_isready, -U, gf, -d, gf]
      interval: 10s
      timeout: 3s
      retries: 6

  # Одноразовый: миграции схемы до старта хаба (packages/db). Упала - хаб остаётся прежним.
  # Ролью владельца базы; после миграций заводит роль хаба gf_hub (только данные, D-051) и
  # выдаёт ей права. Здесь же - команды владельца: заведение и пароль (OPERATIONS.md, admin.ts).
  migrate:
    <<: *hardening
    image: ghcr.io/sirrorist/game-factory-migrate:${GF_IMAGE_TAG:?GF_IMAGE_TAG в .env}
    profiles: [publish]
    mem_limit: 128m
    environment:
      GF_DB_HOST: db
      GF_DB_PASSWORD_FILE: /run/secrets/gf_db_password
      GF_DB_HUB_PASSWORD_FILE: /run/secrets/gf_db_hub_password
    secrets: [gf_db_password, gf_db_hub_password]
    networks: [gf-db]
    depends_on:
      db:
        condition: service_healthy

  play:
    <<: *hardening
    image: ghcr.io/sirrorist/game-factory-play:${GF_IMAGE_TAG:?GF_IMAGE_TAG в .env}
    restart: unless-stopped
    mem_limit: 128m
    environment:
      GF_PLAY_BASE_HOST: play.youranus.ru
      # Только хаб в проде: localhost здесь - дыра в frame-ancestors.
      GF_HUB_ORIGINS: https://games.youranus.ru
    volumes:
      - gf-data:/data:ro
    networks: [gf-edge]
    healthcheck:
      # Служебный хост отвечает только на свой Host - fetch его не даст подменить, поэтому http.get.
      test:
        - CMD
        - node
        - -e
        - >-
          require('node:http').get({ port: 4100, path: '/healthz', headers: { Host: process.env.GF_PLAY_BASE_HOST } },
          (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: gf-edge
      # $$ - экранирование для compose, Traefik получит один $.
      traefik.http.routers.gf-play.rule: 'Host(`play.youranus.ru`) || HostRegexp(`^[a-z0-9-]+\.play\.youranus\.ru$$`)'
      traefik.http.routers.gf-play.entrypoints: websecure
      # *.play.youranus.ru не покрыт *.youranus.ru (П-004), wildcard - только DNS-01.
      # Только wildcard: play.youranus.ru уже покрыт *.youranus.ru, одно значение TXT
      # вместо двух - выпуск и так идёт около часа (П-037).
      traefik.http.routers.gf-play.tls.certresolver: dns01
      traefik.http.routers.gf-play.tls.domains[0].main: '*.play.youranus.ru'
      traefik.http.services.gf-play.loadbalancer.server.port: "4100"

  hub:
    <<: *hardening
    image: ghcr.io/sirrorist/game-factory-hub:${GF_IMAGE_TAG:?GF_IMAGE_TAG в .env}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GF_PLAY_PUBLIC_ORIGIN_TEMPLATE: https://{id}.play.youranus.ru
      # Origin хаба для входа: CSRF (proxy.ts), trustedOrigins и passkey (rpID) - ровно он.
      GF_HUB_ORIGIN: https://games.youranus.ru
      GF_DB_HOST: db
      # Не владелец базы: роль только на select/insert/update/delete своих таблиц (D-051).
      GF_DB_USER: gf_hub
      GF_DB_PASSWORD_FILE: /run/secrets/gf_db_hub_password
      GF_AUTH_SECRET_FILE: /run/secrets/gf_auth_secret
    # Пароля владельца базы у хаба нет вовсе: он только у db и migrate.
    secrets: [gf_db_hub_password, gf_auth_secret]
    volumes:
      - gf-data:/data:ro
    tmpfs:
      - /app/apps/hub/.next/cache
    networks: [gf-edge, gf-db]
    depends_on:
      play:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: gf-edge
      traefik.http.routers.gf-hub.rule: 'Host(`games.youranus.ru`)'
      traefik.http.routers.gf-hub.entrypoints: websecure
      traefik.http.routers.gf-hub.tls.certresolver: letsencrypt
      traefik.http.services.gf-hub.loadbalancer.server.port: "3000"

volumes:
  # Постоянный: в нём история опубликованных версий, на ней держится неизменяемость.
  gf-data:
  # База хаба: учётки, сохранения, очки - из образов не восстановить, бэкап обязателен (D-047).
  gf-db:

secrets:
  # Каталог secrets/ рядом с compose.yml - root 0700, файл - 0644: compose монтирует файл с
  # правами хоста, а читать его внутри должны postgres (70) и node (1000); на хосте каталог
  # закрыт. Создаётся владельцем скрытым вводом (OPERATIONS.md).
  gf_db_password:
    file: ./secrets/db_password
  # Пароль роли хаба gf_hub: migrate ставит его роли, хаб им входит в базу.
  gf_db_hub_password:
    file: ./secrets/db_hub_password
  # Секрет Better Auth: подпись куки сессии. Смена - все сессии недействительны.
  gf_auth_secret:
    file: ./secrets/auth_secret

networks:
  # Своя внутренняя сеть, общая только с Traefik (D-038): без интернета и без соседей
  # по общей сети Traefik. Создаётся владельцем:
  #   docker network create --internal gf-edge && docker network connect gf-edge traefik
  gf-edge:
    external: true
  # База и хаб (D-047): внутренняя, без Traefik. Внешняя, как gf-edge: подсеть задаётся при
  # создании - на неё правило файрвола хоста, иначе хаб дотянется до хоста через эту сеть.
  #   docker network create --internal --subnet <см. приватную базу> gf-db
  gf-db:
    external: true
